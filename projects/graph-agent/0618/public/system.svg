<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" width="1280" height="600" viewBox="0 0 1280 600" font-family="Helvetica, Arial, sans-serif">
  <defs>
    <marker id="arr" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="9" markerHeight="9" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#444"/>
    </marker>
    <marker id="arrL" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="9" markerHeight="9" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#b85450"/>
    </marker>
  </defs>
  <rect width="100%" height="100%" fill="#ffffff"/>

  <text x="640" y="34" text-anchor="middle" font-size="17" font-weight="bold" fill="#999" letter-spacing="3">DEVELOPMENT  →  PRODUCTION</text>

  <!-- ===== Panel containers ===== -->
  <rect x="40"  y="64" width="360" height="476" rx="12" fill="#fafafa" stroke="#d0d0d0" stroke-width="1.5"/>
  <rect x="460" y="64" width="360" height="476" rx="12" fill="#fafafa" stroke="#d0d0d0" stroke-width="1.5"/>
  <rect x="880" y="64" width="360" height="476" rx="12" fill="#fafafa" stroke="#d0d0d0" stroke-width="1.5"/>

  <!-- ===== Panel 1 : BENCHMARK ===== -->
  <text x="220" y="98"  text-anchor="middle" font-size="17" font-weight="bold" fill="#333">1 · EVAL HARNESS</text>
  <text x="220" y="120" text-anchor="middle" font-size="12" font-style="italic" fill="#888">raw DB → one-click pipeline</text>

  <rect x="70" y="142" width="300" height="66" rx="9" fill="#fff2cc" stroke="#d6b656" stroke-width="2"/>
  <text x="220" y="170" text-anchor="middle" font-size="14" font-weight="bold" fill="#222">Raw multi-table DB</text>
  <text x="220" y="190" text-anchor="middle" font-size="12" fill="#555">+ prediction demand</text>

  <rect x="70" y="256" width="300" height="66" rx="9" fill="#dae8fc" stroke="#6c8ebf" stroke-width="2"/>
  <text x="220" y="284" text-anchor="middle" font-size="14" font-weight="bold" fill="#222">8 enterprise tasks</text>
  <text x="220" y="304" text-anchor="middle" font-size="12" fill="#555">4 evaluation modes</text>

  <rect x="70" y="370" width="300" height="66" rx="9" fill="#d5e8d4" stroke="#82b366" stroke-width="2"/>
  <text x="220" y="398" text-anchor="middle" font-size="14" font-weight="bold" fill="#222">Leakage-safe scoring</text>
  <text x="220" y="418" text-anchor="middle" font-size="12" fill="#555">hidden test → a number</text>

  <text x="220" y="470" text-anchor="middle" font-size="12" fill="#777">8 tasks · 1.56M test rows</text>
  <text x="220" y="490" text-anchor="middle" font-size="12" fill="#777">real signal 0.74–0.94 AUROC</text>

  <line x1="220" y1="208" x2="220" y2="256" stroke="#444" stroke-width="2" marker-end="url(#arr)"/>
  <line x1="220" y1="322" x2="220" y2="370" stroke="#444" stroke-width="2" marker-end="url(#arr)"/>

  <!-- ===== Panel 2 : METHOD / ENGINE ===== -->
  <text x="640" y="98"  text-anchor="middle" font-size="17" font-weight="bold" fill="#333">2 · METHOD / AGENT</text>
  <text x="640" y="120" text-anchor="middle" font-size="12" font-style="italic" fill="#888">the two-layer split</text>

  <text x="500" y="150" font-size="11" fill="#9673a6" font-weight="bold">search layer</text>
  <rect x="490" y="156" width="300" height="84" rx="9" fill="#e1d5e7" stroke="#9673a6" stroke-width="2"/>
  <text x="640" y="186" text-anchor="middle" font-size="14" font-weight="bold" fill="#222">Agent harness</text>
  <text x="640" y="207" text-anchor="middle" font-size="12" fill="#555">LLM controller + N workers</text>
  <text x="640" y="225" text-anchor="middle" font-size="12" fill="#555">parallel search</text>

  <line x1="640" y1="240" x2="640" y2="318" stroke="#444" stroke-width="2" marker-end="url(#arr)"/>
  <text x="652" y="270" font-size="11" fill="#d79b00" font-weight="bold">MCP server</text>
  <text x="652" y="287" font-size="10" fill="#888">compile · pit_check</text>
  <text x="652" y="301" font-size="10" fill="#888">materialize</text>

  <text x="500" y="334" font-size="11" fill="#6c8ebf" font-weight="bold">deterministic layer</text>
  <rect x="490" y="340" width="300" height="84" rx="9" fill="#dae8fc" stroke="#6c8ebf" stroke-width="2"/>
  <text x="640" y="372" text-anchor="middle" font-size="14" font-weight="bold" fill="#222">srlang</text>
  <text x="640" y="393" text-anchor="middle" font-size="12" fill="#555">Feature-IR → SQL (DuckDB)</text>
  <text x="640" y="411" text-anchor="middle" font-size="12" fill="#555">typed · leakage-safe · reproducible</text>

  <text x="640" y="470" text-anchor="middle" font-size="11" font-style="italic" fill="#aaa">(MCP boundary — in build)</text>
  <text x="640" y="492" text-anchor="middle" font-size="12" fill="#777">agent: #1 on 3/4 GraphTestbed</text>

  <!-- ===== Panel 3 : PLAYGROUND ===== -->
  <text x="1060" y="98"  text-anchor="middle" font-size="17" font-weight="bold" fill="#333">3 · PLAYGROUND</text>
  <text x="1060" y="120" text-anchor="middle" font-size="12" font-style="italic" fill="#888">SchemaRouter Playground</text>

  <rect x="910" y="156" width="300" height="210" rx="8" fill="#d5e8d4" stroke="#82b366" stroke-width="2"/>
  <rect x="910" y="156" width="300" height="26" rx="8" fill="#82b366"/>
  <circle cx="926" cy="169" r="4" fill="#ffffff" opacity="0.9"/>
  <circle cx="940" cy="169" r="4" fill="#ffffff" opacity="0.9"/>
  <circle cx="954" cy="169" r="4" fill="#ffffff" opacity="0.9"/>
  <text x="1060" y="225" text-anchor="middle" font-size="14" font-weight="bold" fill="#222">Interactive surface</text>
  <text x="1060" y="258" text-anchor="middle" font-size="12" fill="#555">· drive &amp; watch the search</text>
  <text x="1060" y="280" text-anchor="middle" font-size="12" fill="#555">· inspect features &amp; SQL</text>
  <text x="1060" y="302" text-anchor="middle" font-size="12" fill="#555">· compare runs</text>
  <text x="1060" y="345" text-anchor="middle" font-size="11" font-style="italic" fill="#7a9e6e">screenshot in the deck</text>

  <!-- ===== Inter-panel arrows ===== -->
  <line x1="400" y1="168" x2="460" y2="180" stroke="#444" stroke-width="2" marker-end="url(#arr)"/>
  <text x="430" y="158" text-anchor="middle" font-size="11" fill="#555" font-style="italic">tasks · spec</text>

  <line x1="460" y1="408" x2="400" y2="408" stroke="#b85450" stroke-width="2" marker-end="url(#arrL)"/>
  <text x="430" y="430" text-anchor="middle" font-size="11" fill="#b85450" font-style="italic">predictions</text>
  <text x="430" y="444" text-anchor="middle" font-size="11" fill="#b85450" font-style="italic">→ score</text>

  <line x1="820" y1="240" x2="880" y2="240" stroke="#444" stroke-width="2" marker-end="url(#arr)" marker-start="url(#arr)"/>
  <text x="850" y="230" text-anchor="middle" font-size="11" fill="#555" font-style="italic">drive · inspect</text>

  <!-- ===== Legend ===== -->
  <g transform="translate(40, 568)">
    <rect x="0" y="0" width="14" height="14" fill="#e1d5e7" stroke="#9673a6" stroke-width="1.5"/>
    <text x="20" y="12" font-size="12" fill="#444">LLM</text>
    <rect x="80" y="0" width="14" height="14" fill="#dae8fc" stroke="#6c8ebf" stroke-width="1.5"/>
    <text x="100" y="12" font-size="12" fill="#444">Compute</text>
    <rect x="180" y="0" width="14" height="14" fill="#d5e8d4" stroke="#82b366" stroke-width="1.5"/>
    <text x="200" y="12" font-size="12" fill="#444">Store / surface</text>
    <rect x="320" y="0" width="14" height="14" fill="#fff2cc" stroke="#d6b656" stroke-width="1.5"/>
    <text x="340" y="12" font-size="12" fill="#444">I/O</text>
  </g>
</svg>
